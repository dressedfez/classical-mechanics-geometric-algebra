<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="title desc">
<title id="title">Atwood machine with one generalized coordinate</title>
<desc id="desc">Two masses hang from an inextensible string over a fixed pulley. The coordinate q points down on the m2 side and up on the m1 side, showing their linked motion.</desc>
<rect width="800" height="430" fill="#ffffff"/>
<text x="38" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">One string constraint, one independent coordinate</text>
<line x1="150" y1="86" x2="650" y2="86" stroke="#475569" stroke-width="7"/>
<circle cx="400" cy="145" r="76" fill="#f1f5f9" stroke="#475569" stroke-width="5"/>
<circle cx="400" cy="145" r="8" fill="#475569"/>
<path d="M324 145 A76 76 0 0 0 476 145" fill="none" stroke="#475569" stroke-width="6"/>
<line x1="324" y1="145" x2="324" y2="287" stroke="#475569" stroke-width="6"/>
<line x1="476" y1="145" x2="476" y2="287" stroke="#475569" stroke-width="6"/>
<rect x="277" y="284" width="94" height="76" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<rect x="429" y="284" width="94" height="76" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="324" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">m₁</text>
<text x="476" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">m₂</text>
<line x1="232" y1="215" x2="232" y2="156" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
<text x="185" y="145" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">q increases</text>
<line x1="568" y1="156" x2="568" y2="215" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
<text x="586" y="194" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">q</text>
<line x1="400" y1="379" x2="400" y2="406" stroke="#64748b" stroke-width="2.5" marker-end="url(#axisArrow)"/>
<text x="418" y="405" font-family="Arial, sans-serif" font-size="16" fill="#475569">vertical</text>
<text x="38" y="405" font-family="Arial, sans-serif" font-size="16" fill="#475569">As m₂ moves down by q, m₁ moves up by the same amount.</text>
<defs>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/></marker>
  <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
</defs>
</svg>
