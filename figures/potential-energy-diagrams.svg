<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">Potential-energy wells, turning points, and equilibrium stability</title>
<desc id="desc">The left graph shows a spring-like potential well, a horizontal total-energy line, and two turning points bounding the allowed region. The right graphs show a stable local minimum and an unstable local maximum.</desc>
<rect width="1080" height="440" fill="#ffffff"/>
<line x1="610" y1="24" x2="610" y2="415" stroke="#d8dee8" stroke-width="2"/>
<text x="38" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d">A. Energy and turning points</text>
<line x1="75" y1="320" x2="565" y2="320" stroke="#52606d" stroke-width="2.5" marker-end="url(#axis)"/>
<line x1="75" y1="320" x2="75" y2="78" stroke="#52606d" stroke-width="2.5" marker-end="url(#axis)"/>
<path d="M115 85 Q315 470 515 85" fill="none" stroke="#2563eb" stroke-width="5"/>
<path d="M187 198 Q315 357 443 198 L443 198 L187 198 Z" fill="#bfdbfe" opacity="0.65"/>
<line x1="75" y1="198" x2="565" y2="198" stroke="#cf6a1d" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="187" y1="320" x2="187" y2="198" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="443" y1="320" x2="443" y2="198" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="187" cy="198" r="6" fill="#cf6a1d"/>
<circle cx="443" cy="198" r="6" fill="#cf6a1d"/>
<text x="478" y="190" font-family="Arial, sans-serif" font-size="16" fill="#9a4d0b">total energy E</text>
<text x="190" y="344" font-family="Arial, sans-serif" font-size="15" fill="#243b53">x₋</text>
<text x="440" y="344" font-family="Arial, sans-serif" font-size="15" fill="#243b53">x₊</text>
<text x="290" y="375" font-family="Arial, sans-serif" font-size="16" fill="#243b53">position, x</text>
<text x="47" y="230" transform="rotate(-90 47 230)" font-family="Arial, sans-serif" font-size="16" fill="#243b53">potential energy, U</text>
<text x="260" y="178" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a">allowed: U ≤ E</text>
<text x="360" y="283" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">U(x)</text>
<text x="38" y="414" font-family="Arial, sans-serif" font-size="14" fill="#52606d">At a turning point, K = E − U = 0.</text>
<text x="640" y="42" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d">B. Stability near equilibrium</text>
<text x="658" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#276749">local minimum: stable</text>
<line x1="650" y1="315" x2="830" y2="315" stroke="#52606d" stroke-width="2" marker-end="url(#axis)"/>
<line x1="650" y1="315" x2="650" y2="112" stroke="#52606d" stroke-width="2" marker-end="url(#axis)"/>
<path d="M665 125 C690 188 702 270 740 286 C778 270 790 188 815 125" fill="none" stroke="#2f855a" stroke-width="4"/>
<circle cx="740" cy="286" r="6" fill="#276749"/>
<line x1="740" y1="290" x2="740" y2="310" stroke="#276749" stroke-width="2" stroke-dasharray="4 4"/>
<text x="716" y="340" font-family="Arial, sans-serif" font-size="14" fill="#243b53">equilibrium</text>
<text x="840" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a4d0b">local maximum: unstable</text>
<line x1="835" y1="315" x2="1055" y2="315" stroke="#52606d" stroke-width="2" marker-end="url(#axis)"/>
<line x1="835" y1="315" x2="835" y2="112" stroke="#52606d" stroke-width="2" marker-end="url(#axis)"/>
<path d="M850 286 C880 202 910 125 945 125 C980 125 1010 202 1040 286" fill="none" stroke="#cf6a1d" stroke-width="4"/>
<circle cx="945" cy="125" r="6" fill="#9a4d0b"/>
<line x1="945" y1="130" x2="945" y2="310" stroke="#9a4d0b" stroke-width="2" stroke-dasharray="4 4"/>
<text x="920" y="340" font-family="Arial, sans-serif" font-size="14" fill="#243b53">equilibrium</text>
<defs>
  <marker id="axis" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
  </marker>
</defs>
</svg>
