<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
<title id="title">Galileo's inclined-plane timing experiment and reported distance-time relation</title>
<desc id="desc">A schematic shows a ball rolling down a grooved inclined board while elapsed time is estimated from water collected from a vessel. Beside it, a schematic curve shows distance proportional to elapsed time squared, including the reported comparison of one quarter of the track length with one half of the full time.</desc>
<rect width="1080" height="430" fill="#ffffff"/>
<line x1="535" y1="28" x2="535" y2="402" stroke="#d8dee8" stroke-width="2"/>
<text x="40" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d">A. Timed inclined plane</text>
<text x="575" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d">B. Distance grows as time squared</text>
<!-- water vessel and collection cup -->
<path d="M58 95 L155 95 L145 183 L68 183 Z" fill="#edf5fc" stroke="#355070" stroke-width="3"/>
<path d="M64 128 Q105 119 149 128 L145 179 L68 179 Z" fill="#8ecae6" opacity="0.8"/>
<line x1="65" y1="127" x2="149" y2="127" stroke="#3483a5" stroke-width="2"/>
<path d="M145 177 C168 191 171 205 171 219" fill="none" stroke="#355070" stroke-width="4"/>
<path d="M164 215 Q171 227 178 215" fill="#3483a5"/>
<path d="M131 240 L210 240 L202 294 L139 294 Z" fill="#f7fafc" stroke="#355070" stroke-width="3"/>
<path d="M137 273 Q171 267 205 273 L202 291 L139 291 Z" fill="#8ecae6" opacity="0.8"/>
<text x="37" y="78" font-family="Arial, sans-serif" font-size="16" fill="#243b53">water vessel</text>
<text x="48" y="320" font-family="Arial, sans-serif" font-size="15" fill="#243b53">collect and weigh water</text>
<line x1="98" y1="185" x2="98" y2="228" stroke="#607d8b" stroke-width="2" stroke-dasharray="5 5"/>
<text x="35" y="350" font-family="Arial, sans-serif" font-size="14" fill="#52606d">Water flow served as a timing method.</text>
<!-- ramp -->
<polygon points="246,187 500,320 246,320" fill="#edf1f5" stroke="#52606d" stroke-width="2"/>
<line x1="252" y1="190" x2="493" y2="315" stroke="#355070" stroke-width="8" stroke-linecap="round"/>
<circle cx="288" cy="209" r="14" fill="#e9a23b" stroke="#7c4a03" stroke-width="3"/>
<line x1="315" y1="224" x2="389" y2="263" stroke="#cf6a1d" stroke-width="4" marker-end="url(#arrow)"/>
<text x="330" y="211" font-family="Arial, sans-serif" font-size="15" fill="#7c3f00">ball rolls down</text>
<text x="315" y="345" font-family="Arial, sans-serif" font-size="15" fill="#243b53">grooved board, raised slightly</text>
<text x="241" y="165" font-family="Arial, sans-serif" font-size="15" fill="#243b53">ball released from rest</text>
<line x1="276" y1="172" x2="285" y2="191" stroke="#607d8b" stroke-width="2"/>
<!-- plot -->
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#cf6a1d"/>
  </marker>
</defs>
<line x1="650" y1="340" x2="980" y2="340" stroke="#52606d" stroke-width="2.5" marker-end="url(#axisArrow)"/>
<line x1="650" y1="340" x2="650" y2="82" stroke="#52606d" stroke-width="2.5" marker-end="url(#axisArrow)"/>
<defs>
  <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
  </marker>
</defs>
<line x1="650" y1="340" x2="960" y2="115" stroke="#d9e2ec" stroke-width="1.5" stroke-dasharray="5 5"/>
<path d="M650 340 C753 340 857 265 960 115" fill="none" stroke="#2563eb" stroke-width="5"/>
<circle cx="805" cy="283.75" r="7" fill="#cf6a1d" stroke="#ffffff" stroke-width="2"/>
<circle cx="960" cy="115" r="7" fill="#cf6a1d" stroke="#ffffff" stroke-width="2"/>
<line x1="650" y1="340" x2="650" y2="346" stroke="#52606d" stroke-width="2"/>
<line x1="805" y1="340" x2="805" y2="346" stroke="#52606d" stroke-width="2"/>
<line x1="960" y1="340" x2="960" y2="346" stroke="#52606d" stroke-width="2"/>
<text x="644" y="365" font-family="Arial, sans-serif" font-size="14" fill="#52606d">0</text>
<text x="797" y="365" font-family="Arial, sans-serif" font-size="14" fill="#52606d">1/2</text>
<text x="956" y="365" font-family="Arial, sans-serif" font-size="14" fill="#52606d">1</text>
<text x="793" y="397" font-family="Arial, sans-serif" font-size="16" fill="#243b53">elapsed time, t/T</text>
<text x="598" y="222" transform="rotate(-90 598 222)" font-family="Arial, sans-serif" font-size="16" fill="#243b53">distance, s/L</text>
<text x="814" y="268" font-family="Arial, sans-serif" font-size="13" fill="#7c3f00">1/4 length at 1/2 time</text>
<text x="825" y="94" font-family="Arial, sans-serif" font-size="13" fill="#7c3f00">full length at full time</text>
<text x="635" y="420" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Schematic relation s/L = (t/T)^2; markers show a reported ratio, not raw data.</text>
</svg>
