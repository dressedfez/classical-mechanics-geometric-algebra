<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
<title id="title">Pendulum geometry, allowed motion, and forces</title>
<desc id="desc">A pendulum bob hangs from a fixed pivot at an angle theta from the downward vertical. The radius vector and string tension lie along the string, the tangent arrow shows allowed motion, and gravity points downward.</desc>
<rect width="800" height="520" fill="#ffffff"/>
<text x="40" y="44" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">A pendulum: radial constraint and tangent motion</text>
<line x1="300" y1="92" x2="300" y2="370" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 8"/>
<text x="312" y="354" font-family="Arial, sans-serif" font-size="17" fill="#52606d">downward vertical</text>
<line x1="300" y1="92" x2="443" y2="296" stroke="#334155" stroke-width="5"/>
<circle cx="300" cy="92" r="11" fill="#172b4d"/>
<circle cx="443" cy="296" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="481" y="303" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172b4d">bob, mass m</text>
<path d="M300 158 A66 66 0 0 1 338 146" fill="none" stroke="#64748b" stroke-width="3"/>
<text x="337" y="186" font-family="Arial, sans-serif" font-size="20" fill="#172b4d">θ</text>
<text x="350" y="175" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">r, length ℓ</text>
<line x1="436" y1="287" x2="332" y2="138" stroke="#7c3aed" stroke-width="4" marker-end="url(#purpleArrow)"/>
<text x="365" y="238" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#6d28d9">T</text>
<line x1="443" y1="296" x2="443" y2="430" stroke="#cf6a1d" stroke-width="4" marker-end="url(#orangeArrow)"/>
<text x="456" y="405" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#9a4d0b">mg</text>
<line x1="450" y1="292" x2="558" y2="216" stroke="#15803d" stroke-width="4" marker-end="url(#greenArrow)"/>
<text x="550" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">allowed tangent</text>
<line x1="190" y1="454" x2="278" y2="454" stroke="#475569" stroke-width="2.5" marker-end="url(#axisArrow)"/>
<text x="284" y="460" font-family="Arial, sans-serif" font-size="17" fill="#334155">e₁</text>
<line x1="190" y1="454" x2="190" y2="382" stroke="#475569" stroke-width="2.5" marker-end="url(#axisArrow)"/>
<text x="174" y="377" font-family="Arial, sans-serif" font-size="17" fill="#334155">e₂</text>
<text x="40" y="494" font-family="Arial, sans-serif" font-size="16" fill="#475569">The tension is radial; an allowed virtual displacement is tangent to the circular path.</text>
<defs>
  <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
  <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cf6a1d"/></marker>
  <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/></marker>
  <marker id="axisArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
</defs>
</svg>
