<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Predicted graphs for testing Newton's second law</title>
<desc id="desc">Two ideal straight-line graphs through the origin: acceleration versus net force for fixed mass, and acceleration versus inverse mass for fixed net force. The plots show predictions, not experimental data.</desc>
<rect width="1000" height="350" fill="#ffffff"/>
<line x1="500" y1="28" x2="500" y2="320" stroke="#d8dee8" stroke-width="2"/>
<text x="40" y="40" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d">Fixed mass m</text>
<text x="540" y="40" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b4d">Fixed net force Fnet</text>
<!-- left plot -->
<line x1="110" y1="280" x2="435" y2="280" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="110" y1="280" x2="110" y2="80" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="110" y1="280" x2="395" y2="90" stroke="#2563eb" stroke-width="5"/>
<text x="265" y="315" font-family="Arial, sans-serif" font-size="16" fill="#243b53">net force, Fnet</text>
<text x="64" y="180" transform="rotate(-90 64 180)" font-family="Arial, sans-serif" font-size="16" fill="#243b53">acceleration, a</text>
<text x="221" y="117" font-family="Arial, sans-serif" font-size="15" fill="#1d4ed8">a = Fnet/m</text>
<!-- right plot -->
<line x1="610" y1="280" x2="935" y2="280" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610" y1="280" x2="610" y2="80" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610" y1="280" x2="895" y2="90" stroke="#2f855a" stroke-width="5"/>
<text x="746" y="315" font-family="Arial, sans-serif" font-size="16" fill="#243b53">inverse mass, 1/m</text>
<text x="564" y="180" transform="rotate(-90 564 180)" font-family="Arial, sans-serif" font-size="16" fill="#243b53">acceleration, a</text>
<text x="726" y="117" font-family="Arial, sans-serif" font-size="15" fill="#276749">a = Fnet(1/m)</text>
<text x="260" y="345" font-family="Arial, sans-serif" font-size="13" fill="#52606d">Ideal predictions only; real measurements have uncertainty and friction.</text>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#52606d"/>
  </marker>
</defs>
</svg>
