<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
<title id="title">Simple harmonic motion and its phase-plane circle</title>
<desc id="desc">A cosine displacement repeats over time. Beside it, the state vector with coordinates displacement and negative velocity divided by angular frequency moves around a circle; its horizontal projection is the displacement.</desc>
<rect width="980" height="420" fill="#ffffff"/>
<text x="42" y="42" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172b4d">One oscillator, two views of its phase</text>
<text x="42" y="70" font-family="Arial, sans-serif" font-size="16" fill="#52606d">The displacement oscillates while the full state turns uniformly in an abstract plane.</text>
<!-- Oscillation versus time -->
<text x="78" y="112" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#243b53">Displacement in time</text>
