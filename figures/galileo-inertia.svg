<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Galileo's idealized two-incline argument for inertia</title>
<desc id="desc">A ball descends one incline and rises along several possible second inclines to the same height. The shallower the second incline, the farther it must travel. The horizontal frictionless limit has no rise to regain, so the idealized motion continues.</desc>
<rect width="1000" height="330" fill="#ffffff"/>
<text x="40" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172b4d">An idealized argument for inertia</text>
<text x="40" y="70" font-family="Arial, sans-serif" font-size="15" fill="#52606d">Reduce the resistance; flatten the rising track; the distance needed to regain the same height grows.</text>
<line x1="80" y1="258" x2="920" y2="258" stroke="#52606d" stroke-width="2"/>
<!-- descending plane -->
<line x1="120" y1="110" x2="365" y2="258" stroke="#355070" stroke-width="8" stroke-linecap="round"/>
<circle cx="145" cy="125" r="14" fill="#e9a23b" stroke="#7c4a03" stroke-width="3"/>
<line x1="170" y1="139" x2="278" y2="204" stroke="#cf6a1d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="114" y="96" font-family="Arial, sans-serif" font-size="15" fill="#243b53">released from rest</text>
<circle cx="365" cy="258" r="7" fill="#243b53"/>
<!-- same-height guide -->
<line x1="365" y1="110" x2="900" y2="110" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="385" y1="252" x2="385" y2="116" stroke="#607d8b" stroke-width="2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
<text x="396" y="183" font-family="Arial, sans-serif" font-size="16" fill="#243b53">same rise h</text>
<!-- rising paths -->
<line x1="365" y1="258" x2="475" y2="110" stroke="#2f855a" stroke-width="5" stroke-linecap="round"/>
<line x1="365" y1="258" x2="625" y2="110" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<line x1="365" y1="258" x2="865" y2="110" stroke="#805ad5" stroke-width="5" stroke-linecap="round"/>
<circle cx="475" cy="110" r="10" fill="#2f855a"/>
<circle cx="625" cy="110" r="10" fill="#2563eb"/>
<circle cx="865" cy="110" r="10" fill="#805ad5"/>
<text x="380" y="300" font-family="Arial, sans-serif" font-size="14" fill="#276749">steeper, shorter path</text>
<text x="600" y="300" font-family="Arial, sans-serif" font-size="14" fill="#1d4ed8">shallower, longer path</text>
<line x1="365" y1="258" x2="905" y2="258" stroke="#cf6a1d" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="610" y="240" font-family="Arial, sans-serif" font-size="15" fill="#9a4d0b">horizontal limit: no height to regain</text>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#cf6a1d"/>
  </marker>
  <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#607d8b"/>
  </marker>
</defs>
</svg>
