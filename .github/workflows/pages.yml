name: Build and publish MyST book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the book to GitHub Pages (the site will be public)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out the book source
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MyST
        run: npm install --global mystmd@1.11.0

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Build the book PDF
        run: myst build --typst

      - name: Build the static website
        run: myst build --html
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Upload the website for deployment
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
